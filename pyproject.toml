[project]
name = "audiofactory"
version = "0.1.0"
description = "Pipeline local de audiolivros narrados por IA"
requires-python = ">=3.12,<3.14"
dependencies = [
    "chatterbox-tts",
    "soundfile",
    "numpy",
    "pydantic>=2",
    "typer",
    "rich",
    "pyyaml",
    "num2words",
    "faster-whisper",
    "ebooklib",
    "beautifulsoup4",
]

[project.scripts]
audio-factory = "audiofactory.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/audiofactory"]
